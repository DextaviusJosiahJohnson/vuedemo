<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Profile</title>
      <style>
    body {
      margin: 0;
      background: radial-gradient(ellipse at center, #0c1212 0%, #050808 100%);
      background-attachment: fixed;
      background-blend-mode: darken;
      font-family: 'Courier New', Courier, monospace;
      color: #d3d8d3;
    }

    nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 40px 0;
    background: rgba(12, 18, 18, 0.4);
    padding: 20px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    }

    nav a {
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.02);
    color: #d8d8c0;
    text-decoration: none;
    border: 1px solid rgba(200, 200, 200, 0.1);
    border-radius: 10px;
    font-weight: 600;
    font-family: 'Courier New', Courier, monospace;
    transition: 0.25s ease;
    }

    nav a:hover {
    background-color: rgba(255, 215, 0, 0.1);
    color: gold;
    border-color: gold;
    transform: scale(1.06);
    text-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
    }

    .form-wrapper {
      max-width: 400px;
      margin: 40px auto;
      padding: 40px;
      background: rgba(10, 20, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-size: 0.85rem;
      color: #aab6aa;
    }

    input, textarea {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid #666f66;
      color: #d0d8d0;
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      resize: none;
      transition: 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: gold;
      background-color: rgba(255, 255, 255, 0.08);
    }

    button {
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: gold;
      border: 1px solid gold;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }

    button:hover {
      background-color: gold;
      color: black;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    footer {
      text-align: center;
      color: rgba(255, 217, 0, 0.2);
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
</style>
</head>
<body>
  <nav>
    <a href="PhobosFlLayout.html"><b>Layout</b></a>
    <a href="PhobosGridLayout.html"><b>Griddy</b></a>
    <a href="PhobosMedia.html"><b>Media</b></a>

    <a href="PhobosKraber.html"><b>Archives</b></a>
    <a href="rerember.html"><b>Re-Remember</b></a>
  </nav>
<div class="form-wrapper">
    <h2>Re-Remember this soul.</h2>
    <form id="editForm" method="POST">
      <label for="fName">First Name:</label>
      <input type="text" id="fName" name="fName" required>

      <label for="lName">Last Name:</label>
      <input type="text" id="lName" name="lName" required>

      <label for="age">Age:</label>
      <input type="number" id="age" name="age" required>

      <button type="submit">Save Changes</button>
    </form>
  </div>

  <script>
    // Grab user ID from query parameters (e.g., rerember.html?id=1)
    const urlParams = new URLSearchParams(window.location.search);
    const userId = urlParams.get('id');

    if (userId) {
      // Set the form's action dynamically to match the backend route
      document.getElementById('editForm').action = `/update-user/${userId}`;

      // Fetch user data to pre-fill the form inputs
      fetch('/api/users')
        .then(res => res.json())
        .then(users => {
          const user = users.find(u => u.id == userId);
          if (user) {
            document.getElementById('fName').value = user.fName;
            document.getElementById('lName').value = user.lName;
            document.getElementById('age').value = user.age;
          }
        });
    }
  </script>
</body>
</html>
