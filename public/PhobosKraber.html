<!DOCTYPE html>
<html>
<head>
  <title>Phobos - Archives</title>
  <style>
    nav {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin: 40px 0;
      background: rgba(12, 18, 18, 0.4);
      padding: 20px 0;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      backdrop-filter: blur(10px);
    }

    nav a {
      padding: 10px 18px;
      background: rgba(255, 255, 255, 0.02);
      color: #d8d8c0;
      text-decoration: none;
      border: 1px solid rgba(200, 200, 200, 0.1);
      border-radius: 10px;
      font-weight: 600;
      font-family: 'Courier New', Courier, monospace;
      transition: 0.25s ease;
    }

    nav a:hover {
      background-color: rgba(255, 215, 0, 0.1);
      color: gold;
      border-color: gold;
      transform: scale(1.06);
      text-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
    }

    body {
      margin: 0;
      background: radial-gradient(ellipse at center, #0c1212 0%, #050808 100%);
      background-attachment: fixed;
      font-family: 'Courier New', Courier, monospace;
      color: #d3d8d3;
    }
    .archive-container {
      max-width: 600px;
      margin: 40px auto;
      padding: 20px;
      background: rgba(10, 20, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
    }
    
    /* Search Bar Styling */
    #searchInput {
      width: 100%;
      padding: 10px;
      margin-bottom: 20px;
      box-sizing: border-box;
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid #666f66;
      color: #d0d8d0;
      border-radius: 6px;
      font-family: inherit;
    }
    #searchInput:focus {
      outline: none;
      border-color: gold;
      background-color: rgba(255, 255, 255, 0.08);
    }

    .user-card {
      padding: 10px;
      margin-bottom: 10px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }

    footer {
      text-align: center;
      color: rgba(255, 217, 0, 0.2);
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
  </style>
</head>
<body>

  <!-- Your Nav Bar -->
  <nav>
    <a href="PhobosFlLayout.html"><b>Layout</b></a>
    <a href="PhobosGridLayout.html"><b>Griddy</b></a>
    <a href="PhobosMedia.html"><b>Media</b></a>
    <a href="PhobosMiniProject.html"><b>MiniProj</b></a>
    <a href="PhobosNavBar.html"><b>NavBar</b></a>
    <a href="PhobosProfile.html"><b>Profile</b></a>
    <a href="PhobosResume.html"><b>Resume</b></a>
    <a href="PhobosStyledForm.html"><b>Styled Form</b></a>
    <a href="PhobosKraber.html"><b>Archives</b></a>
  </nav>

  <div class="archive-container">
    <h2>User Archives</h2>
    
    <!-- Search Input Field -->
    <input type="text" id="searchInput" placeholder="Search by first or last name...">

    <div id="user-list">Loading archives...</div>
  </div>

  <script>
    let allUsers = [];

    // Function to render the user cards onto the page
    function renderUsers(usersToRender) {
      const listDiv = document.getElementById('user-list');
      listDiv.innerHTML = ''; 
      
      if (usersToRender.length === 0) {
        listDiv.innerHTML = 'No matching archives found.';
        return;
      }

      usersToRender.forEach(user => {
        const card = document.createElement('div');
        card.className = 'user-card';
        card.innerHTML = `<strong>ID:</strong> ${user.id} <br>
                          <strong>Name:</strong> ${user.fName} ${user.lName} <br>
                          <strong>Age:</strong> ${user.age} <br><br>
                          <a href="rerember.html?id=${user.id}" style="color: gold; text-decoration: none; margin-right: 15px;">[Re-Remember]</a>
                          
                          <form action="/delete-user/${user.id}" method="POST" style="display: inline;" onsubmit="return confirm('What sinks often cannot be recovered.');">
                              <button type="submit" style="background: none; border: none; color: #ff5555; cursor: pointer; font-family: 'Courier New', Courier, monospace; font-weight: bold;">[Forget This Soul.]</button>
                          </form>`;
        listDiv.appendChild(card);
      });
    }

    // Fetch initial data from the server
    fetch('/api/users')
      .then(response => response.json())
      .then(users => {
        allUsers = users;
        renderUsers(allUsers); // Render all users initially
      })
      .catch(err => {
        document.getElementById('user-list').innerText = 'Failed to load archives.';
        console.error(err);
      });

    document.getElementById('searchInput').addEventListener('input', function(e) {
      const searchTerm = e.target.value.toLowerCase();
      
      const filtered = allUsers.filter(user => 
        user.fName.toLowerCase().includes(searchTerm) || 
        user.lName.toLowerCase().includes(searchTerm)
      );

      renderUsers(filtered);
    });
  </script>

  <footer><em><b>&copy; Nengasca, Renzo D.:WD303</b></em></footer>
</body>
</html>
