<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Phobos — The Great Archive</title>
    <script src="https://unpkg.com/@tailwindcss/browser@4"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Geist+Mono:wght@400;700&display=swap');

        :root {
            --brand-dark: #122B1C;
            --brand-deep: #0A190F;
            --brand-accent: #CAA552;
            --brand-beige: #F5F5DC;
        }

        body {
            font-family: 'Geist Mono', monospace;
            background: radial-gradient(circle at center, var(--brand-dark), #000);
            background-attachment: fixed;
        }

        .glass-panel {
            background: rgba(18, 43, 28, 0.6);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(202, 165, 82, 0.2);
        }

        .archive-row {
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            border-bottom: 1px solid rgba(202, 165, 82, 0.1);
        }

        .archive-row:hover {
            background: rgba(202, 165, 82, 0.05);
            transform: translateX(4px);
        }

        .search-arcane {
            transition: all 0.3s ease;
            background: rgba(0, 0, 0, 0.4);
        }

        .search-arcane:focus {
            background: rgba(0, 0, 0, 0.6);
            border-color: var(--brand-accent);
            box-shadow: 0 0 15px rgba(202, 165, 82, 0.1);
        }
    </style>
</head>
<body class="min-h-[100dvh] text-brand-beige selection:bg-brand-accent selection:text-brand-deep flex flex-col">

    <nav class="flex justify-center flex-wrap gap-3 p-6 mb-12 relative z-20">
        <a href="PhobosBasic.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Basic</a>
        <a href="PhobosButton.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Button</a>
        <a href="PhobosFlLayout.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Layout</a>
        <a href="PhobosGridLayout.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Griddy</a>
        <a href="PhobosMedia.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Media</a>
        <a href="PhobosMiniProject.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">MiniProj</a>
        <a href="PhobosNavBar.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">NavBar</a>
        <a href="PhobosProfile.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Profile</a>
        <a href="PhobosResume.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Resume</a>
        <a href="PhobosStyledForm.html" class="px-4 py-2 glass-panel rounded-lg text-sm font-bold hover:bg-black hover:text-brand-accent transition-all duration-300">Styled Form</a>
        <a href="PhobosKraber.html" class="px-4 py-2 bg-black text-brand-accent rounded-lg text-sm font-bold border border-brand-accent">Archives</a>
    </nav>

    <main class="flex-1 max-w-4xl mx-auto px-6 w-full py-12">
        <div class="glass-panel p-8 md:p-12 rounded-3xl relative overflow-hidden">
            <div class="absolute -top-24 -right-24 w-64 h-64 bg-brand-accent/10 blur-3xl rounded-full pointer-events-none"></div>

            <header class="text-center mb-12 relative z-10">
                <span class="block text-[10px] uppercase tracking-[0.4em] text-brand-accent mb-4 opacity-70 font-bold">Soul Registry</span>
                <h1 class="text-4xl md:text-6xl font-bold tracking-tighter mb-4">User Archives</h1>
                <p class="text-sm opacity-50 italic">Indexing the echoes of the forgotten.</p>
            </header>

            <div class="relative z-10 space-y-8">
                <div class="relative max-w-md mx-auto">
                    <input type="text" id="searchInput"
                           placeholder="Search by first or last name..."
                           class="search-arcane w-full px-6 py-4 rounded-full border border-white/10 text-sm focus:outline-none transition-all text-center placeholder:text-white/20">
                    <div class="absolute right-4 top-1/2 -translate-y-1/2 opacity-30">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
                    </div>
                </div>

                <div class="overflow-hidden rounded-2xl border border-white/5 bg-black/20">
                    <div class="grid grid-cols-3 gap-4 p-4 text-[10px] uppercase tracking-widest opacity-40 font-bold border-b border-white/10 bg-black/40">
                        <div>ID</div>
                        <div>Identity</div>
                        <div class="text-right">Age</div>
                    </div>
                    <div id="user-list" class="divide-y divide-white/5">
                        <div class="p-12 text-center opacity-30 text-sm animate-pulse">Consulting the void...</div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <footer class="p-12 text-center opacity-30 text-[10px] uppercase tracking-widest">
        &copy; Nengasca, Renzo D. : WD303
    </footer>

    <script>
        let allUsers = [];

        function renderUsers(usersToRender) {
            const listDiv = document.getElementById('user-list');
            listDiv.innerHTML = '';

            if (usersToRender.length === 0) {
                listDiv.innerHTML = '<div class="p-12 text-center opacity-30 text-sm">No matching archives found.</div>';
                return;
            }

            usersToRender.forEach(user => {
                const row = document.createElement('div');
                row.className = 'archive-row grid grid-cols-3 gap-4 p-4 items-center text-sm';
                row.innerHTML = `
                    <div class="opacity-40 font-mono text-xs">#${user.id}</div>
                    <div class="font-bold text-brand-beige">${user.fName} ${user.lName}</div>
                    <div class="flex items-center justify-end gap-4">
                        <span class="opacity-60">${user.age}</span>
                        <a href="rerember.html?id=${user.id}" class="text-brand-accent text-[10px] uppercase tracking-tighter hover:underline">Remember</a>
                        <form action="/delete-user/${user.id}" method="POST" onsubmit="return confirm('What sinks often cannot be recovered.');">
                            <button type="submit" class="text-red-500/50 hover:text-red-500 text-[10px] uppercase tracking-tighter transition-colors">Forget</button>
                        </form>
                    </div>
                `;
                listDiv.appendChild(row);
            });
        }

        fetch('/api/users')
            .then(response => response.json())
            .then(users => {
                allUsers = users;
                renderUsers(allUsers);
            })
            .catch(err => {
                document.getElementById('user-list').innerHTML = '<div class="p-12 text-center opacity-30 text-sm text-red-400">Failed to load archives.</div>';
                console.error(err);
            });

        document.getElementById('searchInput').addEventListener('input', function(e) {
            const searchTerm = e.target.value.toLowerCase();
            const filtered = allUsers.filter(user =>
                user.fName.toLowerCase().includes(searchTerm) ||
                user.lName.toLowerCase().includes(searchTerm)
            );
            renderUsers(filtered);
        });
    </script>
</body>
</html>
