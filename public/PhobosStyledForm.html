<!DOCTYPE html>
<html>
<head>
  <title>Phobos</title>
  <style>
    body {
      margin: 0;
      background: radial-gradient(ellipse at center, #0c1212 0%, #050808 100%);
      background-attachment: fixed;
      background-blend-mode: darken;
      font-family: 'Courier New', Courier, monospace;
      color: #d3d8d3;
    }

    nav {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 12px;
    margin: 40px 0;
    background: rgba(12, 18, 18, 0.4);
    padding: 20px 0;
    border-top: 1px solid rgba(255, 255, 255, 0.05);
    border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    backdrop-filter: blur(10px);
    }

    nav a {
    padding: 10px 18px;
    background: rgba(255, 255, 255, 0.02);
    color: #d8d8c0;
    text-decoration: none;
    border: 1px solid rgba(200, 200, 200, 0.1);
    border-radius: 10px;
    font-weight: 600;
    font-family: 'Courier New', Courier, monospace;
    transition: 0.25s ease;
    }

    nav a:hover {
    background-color: rgba(255, 215, 0, 0.1);
    color: gold;
    border-color: gold;
    transform: scale(1.06);
    text-shadow: 0 0 6px rgba(255, 215, 0, 0.3);
    }

    .form-wrapper {
      max-width: 400px;
      margin: 40px auto;
      padding: 40px;
      background: rgba(10, 20, 18, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.05);
      border-radius: 14px;
      box-shadow: 0 0 30px rgba(0, 0, 0, 0.4);
      backdrop-filter: blur(12px);
    }

    form {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    label {
      font-size: 0.85rem;
      color: #aab6aa;
    }

    input, textarea {
      background-color: rgba(255, 255, 255, 0.05);
      border: 1px solid #666f66;
      color: #d0d8d0;
      padding: 10px;
      border-radius: 6px;
      font-family: inherit;
      resize: none;
      transition: 0.2s ease;
    }

    input:focus, textarea:focus {
      outline: none;
      border-color: gold;
      background-color: rgba(255, 255, 255, 0.08);
    }

    button {
      padding: 10px 20px;
      background-color: rgba(0, 0, 0, 0.7);
      color: gold;
      border: 1px solid gold;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      letter-spacing: 0.5px;
      transition: all 0.25s ease;
    }

    button:hover {
      background-color: gold;
      color: black;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    footer {
      text-align: center;
      color: rgba(255, 217, 0, 0.2);
      font-size: 0.8rem;
      margin-bottom: 16px;
    }
  </style>
</head>

<body>
  <nav>
    <a href="PhobosBasic.html"><b>Basic</b></a>
    <a href="PhobosButton.html"><b>Button</b></a>
    <a href="PhobosFlLayout.html"><b>Layout</b></a>
    <a href="PhobosGridLayout.html"><b>Griddy</b></a>
    <a href="PhobosMedia.html"><b>Media</b></a>
    <a href="PhobosMiniProject.html"><b>MiniProj</b></a>
    <a href="PhobosNavBar.html"><b>NavBar</b></a>
    <a href="PhobosProfile.html"><b>Profile</b></a>
    <a href="PhobosResume.html"><b>Resume</b></a>
    <a href="PhobosStyledForm.html"><b>Styled Form</b></a>
    <a href="PhobosKraber.html"><b>Archives</b></a>
    <a href="rerember.html"><b>Re-Remember</b></a>
  </nav>

  <div class="form-wrapper">
    <form action="/PhobosStyledForm.html" method="POST">

      <label for="forgotten">Name of the Forgotten</label>
      <input
        type="text"
        id="fName"
        name="fName"
        placeholder="Etch a name you barely remember"
      >

      <label for="lsl">Last Known Location</label>
      <input
        type="text"
        id="lName"
        name="lName"
        placeholder="Etch a lineage you barely remember"
      >
      <label for="age">Age</label>
      <input
        type="text"
        id="age"
        name="age"
        placeholder="How many winters did this one last"
      >

    <button type="submit">Submit to the Archive</button>
    </form>
  </div>

  <footer><em><b>&copy; Nengasca, Renzo D.:WD303</b></em></footer>
</body>
</html>
