<!DOCTYPE html>
<html>
<head>
    <title>Phobos</title>
    <style>
        body {
            margin: 0;
            background: url('NavBar.webp') no-repeat center center fixed;
            background-size: cover;
            font-family: 'Courier New', Courier, monospace;
            color: #d0d8d0;
        }

        .container {
            display: flex;
            justify-content: center;
            align-items: center;
            height: 93vh;
            width: 100%;
            padding: 20px;
            box-sizing: border-box;
        }

        .moroi {
            background: rgba(14, 34, 26, 0.85);
            backdrop-filter: blur(18px);
            border: 2px solid #1b3a2c;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 0 45px rgba(0, 0, 0, 0.7);
            text-align: center;
            max-width: 850px;
            width: 100%;
        }

        nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 14px;
            margin-bottom: 40px;
        }

        nav a {
            padding: 12px 22px;
            background: rgba(18, 43, 28, 0.75);
            color: #e6e8e3;
            text-decoration: none;
            border: 1px solid #2a4d34;
            border-radius: 6px;
            font-weight: 600;
            letter-spacing: 0.4px;
            font-size: 0.92rem;
            transition: all 0.2s ease;
            box-shadow:
                inset 0 0 0 rgba(0, 0, 0, 0),
                0 0 6px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(4px);
            text-shadow: 0 0 2px rgba(0, 0, 0, 0.2);
        }

        nav a:hover {
            background: rgba(0, 0, 0, 0.9);
            color: #d9b858;
            border-color: #5b4e1c;
            transform: scale(1.07);
            box-shadow:
                0 0 10px rgba(217, 184, 88, 0.3),
                inset 0 0 5px rgba(217, 184, 88, 0.2);
        }

        h1 {
            font-size: 1.1rem;
            line-height: 1.75;
            margin: 0;
            color: #c4ccc4;
            font-weight: 400;
        }

        p {
            margin-top: 20px;
            font-size: 0.88rem;
            color: #aaa;
        }

        footer {
            text-align: center;
            color: rgba(255, 217, 0, 0.2);
            font-size: 0.8rem;
            margin-bottom: 12px;
        }
    </style>
</head>
